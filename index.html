<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doncarlos League V5</title>
<style>
:root{--bg:#050c16;--p:#0d1828;--p2:#12243a;--line:#203751;--txt:#edf6ff;--mut:#8fa4bd;--a:#21c5ff;--g:#35d18a;--r:#ff6573}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#102a45,#050c16 50%);color:var(--txt);font:15px system-ui,Arial}header{position:sticky;top:0;z-index:20;background:#050c16ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.wrap{max-width:1300px;margin:auto;padding:0 18px}.top{min-height:68px;display:flex;align-items:center;gap:14px;justify-content:space-between}.brand{font-weight:900;font-size:21px;white-space:nowrap}.brand b{color:var(--a)}nav{display:flex;gap:5px;overflow:auto}button,.btn{border:1px solid var(--line);background:var(--p);color:var(--txt);padding:9px 12px;border-radius:10px;cursor:pointer}button:hover{border-color:var(--a)}main{padding:24px 0 60px}.hero{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#102a44,#0b1728);margin-bottom:16px}.hero h1{font-size:40px;margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.panel,.stat,.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:16px}.stat strong{display:block;font-size:29px}.muted{color:var(--mut)}h2{margin-top:0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;color:var(--mut);text-transform:uppercase}.team{display:flex;align-items:center;gap:10px}.shield{width:45px;height:45px;object-fit:contain;background:#07111d;border-radius:9px;padding:4px}.bigshield{width:90px;height:90px;object-fit:contain;background:#07111d;border-radius:16px;padding:8px}.pill{padding:4px 8px;border-radius:99px;background:#15304a;color:#bdeeff;font-size:12px}.primary{background:var(--a);color:#00131d;border-color:var(--a);font-weight:800}.danger{color:#ff9ba5}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}label{font-size:12px;color:var(--mut);display:block;margin:7px 0 4px}input,select,textarea{width:100%;background:#07111d;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:100px}.match{display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.match .away{text-align:right}.score{text-align:center;font-weight:900}.event{padding:7px 10px;border-left:3px solid var(--a);margin:5px 0;background:#0a1725}.news{border-bottom:1px solid var(--line);padding:10px 0}.ok{color:var(--g)}.login{max-width:420px;margin:50px auto}.footer{text-align:center;color:var(--mut);padding:30px}@media(max-width:850px){.grid,.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column;padding:11px 0}}@media(max-width:600px){.grid,.grid2,.cards,.form{grid-template-columns:1fr}.hero h1{font-size:31px}.match{grid-template-columns:1fr 55px 1fr}}
</style></head><body><header><div class="wrap top"><div class="brand">⚽ <b>Doncarlos</b> League <span class="pill">V5</span></div><nav id="nav"></nav><div id="auth"></div></div></header><main class="wrap" id="app"></main><div class="footer">Doncarlos League V5 · PostgreSQL · Railway · Twitch-ready</div>
<script>
let S={page:"home",round:1,team:null,match:null,state:null,token:localStorage.getItem("dl5"),admin:JSON.parse(localStorage.getItem("dl5admin")||"null")};const $=x=>document.getElementById(x),E=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(u,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})};let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Error");return d}
async function load(){S.state=await api("/api/state");nav();render()}function nav(){let n=[["home","Inicio"],["calendar","Calendario"],["teams","Equipos"],["players","Jugadores"],["scorers","Goleadores"],["stats","Estadísticas"],["playoffs","Playoffs"],["news","Noticias"],["seasons","Temporadas"],["admin","Admin"]];$("nav").innerHTML=n.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("");$("auth").innerHTML=S.admin?`<span class="pill">${E(S.admin.username)} · ${E(S.admin.role)}</span><button onclick="logout()">Salir</button>`:`<button onclick="go('login')">Admin</button>`}function go(p){S.page=p;render()}function logout(){localStorage.clear();location.reload()}
function standings(){let a=S.state.teams.map(t=>({...t,pj:0,gf:0,gc:0,pts:0,w:0,d:0,l:0})),m=Object.fromEntries(a.map(t=>[t.id,t]));for(let x of S.state.matches)if(x.status==="played"&&x.home_goals!=null){let h=m[x.home_id],v=m[x.away_id];h.pj++;v.pj++;h.gf+=+x.home_goals;h.gc+=+x.away_goals;v.gf+=+x.away_goals;v.gc+=+x.home_goals;if(x.home_goals>x.away_goals){h.w++;h.pts+=3;v.l++}else if(x.home_goals<x.away_goals){v.w++;v.pts+=3;h.l++}else{h.d++;v.d++;h.pts++;v.pts++}}return a.sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc))}
function stTable(a){return `<table class="table"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>PTS</th></tr></thead><tbody>${a.map((t,i)=>`<tr><td>${i+1}</td><td><div class="team"><img class="shield" src="${E(t.shield||"")}"><b>${E(t.name)}</b></div></td><td>${t.pj}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.gc}</td><td><b>${t.pts}</b></td></tr>`).join("")}</tbody></table>`}
function home(){let m=S.state.matches.filter(x=>x.status!=="played").slice(0,5);return `<div class="hero"><h1>Doncarlos League</h1><p>La central de la liga: partidos, equipos, jugadores, estadísticas, playoffs, noticias y temporadas.</p><span class="pill">${E(S.state.active?.name)}</span></div><div class="grid"><div class="stat"><span class="muted">Equipos</span><strong>${S.state.teams.length}</strong></div><div class="stat"><span class="muted">Jugadores</span><strong>${S.state.players.length}</strong></div><div class="stat"><span class="muted">Partidos</span><strong>${S.state.matches.filter(x=>x.status==="played").length}/${S.state.matches.length}</strong></div><div class="stat"><span class="muted">Jornadas</span><strong>22</strong></div></div><div class="grid2" style="margin-top:14px"><div class="panel"><h2>Clasificación</h2>${stTable(standings().slice(0,8))}</div><div class="panel"><h2>Próximos partidos</h2>${m.map(mk).join("")}</div></div><div class="panel" style="margin-top:14px"><h2>Últimas noticias</h2>${S.state.news.slice(0,4).map(n=>`<div class="news"><b>${E(n.title)}</b><p class="muted">${E(n.body).slice(0,180)}</p></div>`).join("")||"<p class='muted'>No hay noticias.</p>"}</div>`}
function mk(m){return `<div class="match"><div><b>${E(m.home_name)}</b></div><div class="score">${m.status==="played"?m.home_goals+"-"+m.away_goals:"vs"}</div><div class="away"><b>${E(m.away_name)}</b></div></div>`}
function calendar(){let r=Math.max(1,Math.min(22,S.round)),m=S.state.matches.filter(x=>x.round===r);return `<div class="panel"><h2>Jornada ${r}</h2><div class="actions"><button onclick="S.round=Math.max(1,S.round-1);render()">←</button><button onclick="S.round=Math.min(22,S.round+1);render()">→</button></div>${m.map(mk).join("")}</div>`}
function teams(){return `<h2>Equipos</h2><div class="cards">${S.state.teams.map(t=>`<div class="card"><div class="team"><img class="bigshield" src="${E(t.shield||"")}"><div><h3>${E(t.name)}</h3><span class="pill">${E(t.short_name||"")}</span></div></div><p class="muted">${E(t.city||"")} · ${E(t.stadium||"")}</p><button onclick="S.team=${t.id};go('team')">Ver perfil</button></div>`).join("")}</div>`}
function team(){let t=S.state.teams.find(x=>x.id==S.team),ps=S.state.players.filter(p=>p.team_id==t.id);return `<div class="panel"><div class="team"><img class="bigshield" src="${E(t.shield||"")}"><div><h1>${E(t.name)}</h1><p class="muted">${E(t.city||"")} · ${E(t.stadium||"")}</p></div></div><p>${E(t.description||"Sin descripción.")}</p></div><div class="panel" style="margin-top:14px"><h2>Plantilla</h2><table class="table"><tr><th>Jugador</th><th>#</th><th>Posición</th><th>Goles</th><th>Asist.</th></tr>${ps.map(p=>`<tr><td>${E(p.name)}</td><td>${p.number??"-"}</td><td>${E(p.position)}</td><td>${p.goals}</td><td>${p.assists}</td></tr>`).join("")}</table></div>`}
function players(){return `<div class="panel"><h2>Jugadores</h2><table class="table"><tr><th>Jugador</th><th>Equipo</th><th>Posición</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th></tr>${S.state.players.map(p=>`<tr><td><b>${E(p.name)}</b></td><td>${E(p.team_name)}</td><td>${E(p.position)}</td><td>${p.goals}</td><td>${p.assists}</td><td>${p.yellow}</td><td>${p.red}</td></tr>`).join("")}</table></div>`}
function scorers(){return `<div class="panel"><h2>Goleadores</h2>${S.state.players.slice().sort((a,b)=>b.goals-a.goals).map((p,i)=>`<div class="match"><div>${i+1}. <b>${E(p.name)}</b><br><span class="muted">${E(p.team_name)}</span></div><div class="score">${p.goals}</div><div class="away">goles</div></div>`).join("")}</div>`}
function stats(){let s=standings(),top=S.state.players.slice().sort((a,b)=>b.goals-a.goals)[0];return `<div class="grid"><div class="stat"><span class="muted">Máximo goleador</span><strong>${E(top?.name||"-")}</strong></div><div class="stat"><span class="muted">Goles</span><strong>${top?.goals||0}</strong></div><div class="stat"><span class="muted">Mejor ataque</span><strong>${E(s.slice().sort((a,b)=>b.gf-a.gf)[0]?.name||"-")}</strong></div><div class="stat"><span class="muted">Líder</span><strong>${E(s[0]?.name||"-")}</strong></div></div><div class="panel" style="margin-top:14px"><h2>Tabla completa</h2>${stTable(s)}</div>`}
function playoffs(){return `<div class="panel"><h2>Playoffs y final</h2>${S.state.playoffs.map(p=>`<div class="match"><div><b>${E(p.home_name||"Por definir")}</b><br><span class="pill">${E(p.stage)}</span></div><div class="score">${p.home_goals??"-"} : ${p.away_goals??"-"}</div><div class="away"><b>${E(p.away_name||"Por definir")}</b></div></div>`).join("")||"<p class='muted'>No hay eliminatorias creadas.</p>"}</div>`}
function news(){return `<div class="panel"><h2>Noticias</h2>${S.state.news.map(n=>`<article class="news"><h3>${E(n.title)}</h3><p>${E(n.body)}</p></article>`).join("")||"<p class='muted'>No hay noticias.</p>"}</div>`}
function seasons(){return `<div class="panel"><h2>Temporadas</h2>${S.state.seasons.map(x=>`<div class="match"><div><b>${E(x.name)}</b></div><div class="score">${x.active?"ACTIVA":"ARCHIVADA"}</div><div class="away">${x.active?"":"Disponible"}</div></div>`).join("")}</div>`}
function login(){return `<div class="panel login"><h2>Administración</h2><label>Usuario</label><input id="u" value="admin"><label>Contraseña</label><input id="p" type="password"><button class="primary" style="width:100%;margin-top:10px" onclick="loginDo()">Entrar</button></div>`}
function admin(){if(!S.admin)return `<div class="panel"><h2>Administración</h2><p class="muted">Inicia sesión para continuar.</p><button class="primary" onclick="go('login')">Iniciar sesión</button></div>`;let t=S.state.teams;return `<div class="grid2"><div class="panel"><h2>Resultado</h2><label>ID partido</label><input id="mi" type="number"><div class="form"><div><label>Local</label><input id="mh" type="number"></div><div><label>Visitante</label><input id="ma" type="number"></div></div><button class="primary" style="margin-top:10px" onclick="saveM()">Guardar</button></div><div class="panel"><h2>Nuevo jugador</h2><select id="pt">${t.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join("")}</select><label>Nombre</label><input id="pn"><label>Posición</label><input id="pp"><button class="primary" style="margin-top:10px" onclick="newP()">Crear</button></div><div class="panel"><h2>Evento de partido</h2><label>ID partido</label><input id="ei" type="number"><label>Minuto</label><input id="em" type="number"><label>Tipo</label><select id="et"><option value="goal">Gol</option><option value="yellow">Tarjeta amarilla</option><option value="red">Tarjeta roja</option><option value="sub">Cambio</option></select><label>Jugador</label><select id="ep">${S.state.players.map(p=>`<option value="${p.id}">${E(p.name)} · ${E(p.team_name)}</option>`).join("")}</select><button class="primary" style="margin-top:10px" onclick="eventP()">Añadir evento</button></div><div class="panel"><h2>Nueva temporada</h2><input id="sn" placeholder="Temporada 2"><button class="primary" style="margin-top:10px" onclick="newS()">Crear y activar</button></div><div class="panel"><h2>Noticia</h2><input id="nt" placeholder="Título"><textarea id="nb" placeholder="Contenido"></textarea><button class="primary" style="margin-top:10px" onclick="newN()">Publicar</button></div><div class="panel"><h2>Escudo</h2><select id="ut">${t.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join("")}</select><input id="uf" type="file" accept="image/*" style="margin-top:8px"><button class="primary" style="margin-top:8px" onclick="up()">Subir</button></div><div class="panel"><h2>Playoff</h2><input id="ps" placeholder="Semifinal / Final"><div class="form"><select id="ph">${t.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join("")}</select><select id="pa">${t.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join("")}</select></div><button class="primary" style="margin-top:8px" onclick="newPO()">Crear</button></div><div class="panel"><h2>Twitch</h2><input id="tw" placeholder="canal"><button class="primary" style="margin-top:8px" onclick="tw()">Guardar</button><p class="muted">OAuth Twitch completo queda preparado para conectar Client ID/Redirect URI.</p></div></div>`}
async function loginDo(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("u").value,password:$("p").value})});S.token=d.token;S.admin=d.admin;localStorage.setItem("dl5",S.token);localStorage.setItem("dl5admin",JSON.stringify(S.admin));await load();go("admin")}catch(e){alert(e.message)}}
async function saveM(){try{await api("/api/matches/"+$("mi").value,{method:"PUT",body:JSON.stringify({home_goals:+$("mh").value,away_goals:+$("ma").value,status:"played"})});await load();alert("Resultado guardado")}catch(e){alert(e.message)}}
async function newP(){try{await api("/api/players",{method:"POST",body:JSON.stringify({team_id:+$("pt").value,name:$("pn").value,position:$("pp").value})});await load();alert("Jugador creado")}catch(e){alert(e.message)}}
async function eventP(){try{await api("/api/matches/"+$("ei").value+"/events",{method:"POST",body:JSON.stringify({minute:+$("em").value,type:$("et").value,player_id:+$("ep").value})});await load();alert("Evento añadido")}catch(e){alert(e.message)}}
async function newS(){try{await api("/api/seasons",{method:"POST",body:JSON.stringify({name:$("sn").value})});await load();alert("Temporada creada")}catch(e){alert(e.message)}}
async function newN(){try{await api("/api/news",{method:"POST",body:JSON.stringify({title:$("nt").value,body:$("nb").value})});await load();alert("Noticia publicada")}catch(e){alert(e.message)}}
async function newPO(){try{await api("/api/playoffs",{method:"POST",body:JSON.stringify({stage:$("ps").value,home_team_id:+$("ph").value,away_team_id:+$("pa").value})});await load();alert("Playoff creado")}catch(e){alert(e.message)}}
async function up(){let f=$("uf").files[0];if(!f)return alert("Selecciona una imagen");let fd=new FormData();fd.append("image",f);let r=await fetch("/api/upload/team/"+$("ut").value,{method:"POST",headers:{Authorization:"Bearer "+S.token},body:fd});if(!r.ok)return alert("Error");await load();alert("Escudo actualizado")}
async function tw(){try{await api("/api/twitch",{method:"PUT",body:JSON.stringify({channel:$("tw").value,enabled:true})});alert("Twitch guardado")}catch(e){alert(e.message)}}
function render(){let f={home,calendar,teams,team,players,scorers,stats,playoffs,news,seasons,admin,login}[S.page]||home;$("app").innerHTML=f()}load().catch(e=>$("app").innerHTML=`<div class="panel"><h2>Error de conexión</h2><p>${E(e.message)}</p></div>`);
</script></body></html>
